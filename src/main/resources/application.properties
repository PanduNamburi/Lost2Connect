# ===================================================================
# Lost2Found Application Configuration (Firebase Firestore)
# ===================================================================

server.port=${PORT:8080}
server.servlet.context-path=/

# Spring Application Name
spring.application.name=lost2found

# Profile Configuration
spring.profiles.active=dev

# Firebase Configuration (Updated with user's exact Firebase Project ID)
app.firebase.project-id=lost2found-94c5a
app.firebase.config-path=classpath:serviceAccountKey.json

# Multipart File Upload Configurations
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom App JWT Configuration
app.jwt.secret=9a2f8c4e7b1d3a5f8e0c2b4a6f8d1e3c5a7b9d1e3f5a7c9b1d3e5f7a9b1c3d5e
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Application Pagination Defaults
app.pagination.default-page-number=0
app.pagination.default-page-size=10
app.pagination.max-page-size=50

# Logging Configurations
logging.level.root=INFO
logging.level.com.lost2found=DEBUG
